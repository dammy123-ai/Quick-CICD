name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

  jobs:
    build-and-test:
      runs_on: ubuntu_latest
      steps:
        - uses: actions/checkout@v4

        - name: Build Docker image
          run: docker build -t quick-cicd .

        - name: Run container
          run: docker run -d -name quick-cici -p 5000:500 quick-cicd

        - name: Test application
          run: |
            for i in {1..10}; do
              curl -fsS http://localhost:5000/ && exit 0
              sleep 2
            done
            exit 1
